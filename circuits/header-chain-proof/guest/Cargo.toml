[package]
name = "header-chain-guest"
version = "1.1.0"
edition = "2021"
publish = false

[dependencies]
#{ version = "0.2", features = ["extra_traits"] }
bincode = "1.3.3"
# workspace
header-chain = { path = "../../crates/header-chain" }
borsh = { version = "1.5.3", features = ["derive"] }

# Ziren
zkm-zkvm = { git = "https://github.com/ProjectZKM/Ziren", features = ["verify"] }
#zkm-zkvm = { path = "../../../Ziren/crates/zkvm/entrypoint", features = ["verify"] }

# Statically turns off logging
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
tracing = { version = "0.1", features = ["max_level_trace"] }

bitcoin = { version = "0.32.6", features = ["serde", "rand", "secp-recovery"] }

sha2 = "0.10.9"


[features]
imm-wrap-vk = ["zkm-zkvm/imm-wrap-vk", "header-chain/imm-wrap-vk"]
