\* H2 FIX DESIGN (design): deletion on by default, and every terminal state
\* deletes, including Timeout (tdelay after entering it); success side
\* unchanged (Confirm kd deep). Full sweep T0, B 1..2, kd, react, tdelay
\* 0..2, window 0..4 restricted to ParamsOK (kd + react <= W, tdelay + react
\* <= W) -> expected to PASS NoSweepAfterSettlement.
SPECIFICATION Spec
CONSTANTS
    NetSet = {}
    T0Range = {1,2}
    BRange = {1,2}
    KDRange = {0,1,2}
    ReactRange = {0,1,2}
    TimeoutDelayRange = {0,1,2}
    WindowRange = {0,1,2,3,4}
    ParamFilter = "ok"
    DeleteEnabled = TRUE
    DeleteOnTimeout = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOk
    NoEarlySuccessDelete
    NoSweepAfterSettlement
