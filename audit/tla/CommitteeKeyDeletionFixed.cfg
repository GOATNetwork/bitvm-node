\* H2 FIX DESIGN: deletion on by default, and every terminal state deletes,
\* including Timeout (after TimeoutDelay <= KD blocks); success side unchanged
\* (Confirm KD deep) -> expected to PASS NoSweepAfterSettlement.
SPECIFICATION Spec
CONSTANTS
    T0 = 2
    B = 1
    KD = 2
    Hp = 1
    MaxHeight = 8
    DeleteEnabled = TRUE
    DeleteOnTimeout = TRUE
    TimeoutDelay = 1
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoEarlySuccessDelete
    NoSweepAfterSettlement
