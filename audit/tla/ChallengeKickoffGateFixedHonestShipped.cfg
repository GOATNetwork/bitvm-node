\* tier boundary
\* COST OF THE FIX: the fixed gate contests an Initialized withdraw that is
\* not Processing by its wake (kickH + ca - 1 - incl - r). The relayer can
\* only proceedWithdraw once spv >= kickH (tip >= kickH + sc, + lag, + its
\* own reaction), so an HONEST withdraw (initialized before the kickoff) is
\* left unchallenged only under ParamsLive == ca >= sc + lag + 2r + incl + 3.
\* BOUNDARY, SHIPPED Testnet4 / Signet / Regtest with a healthy SPV (lag 0):
\* ParamsLive fails on each (6 < 10+0+1+3, 6 < 6+0+1+3, 2 < 1+0+1+3 even at
\* r = 0, incl = 1; each fails on its own), so the fixed gate challenges every honest peg-out there unless
\* connector_a >= BTC_BLOCK_CONFIRMS + lag + 2r + incl + 3.
\* Expected to FAIL.
CONSTANTS
    NetSet = {"Testnet4", "Signet", "Regtest"}  ShippedBudget = "range"  LazySpv = FALSE
    ConnectorARange = {1}  SpvConfirmsRange = {1}  InclusionRange = {1}  ReactionRange = {0}
    SpvLagRange = {0}  SyncStallRange = {0}
    Region = "all"
    EnableLateInit = TRUE  FixGate = TRUE  FixScan = TRUE  FixCancel = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOk
INVARIANT NoHonestChallenge
PROPERTY ParamsFrozen
PROPERTY OutcomesFinal
