\* Fix design on the AS-SHIPPED Signet and Regtest timelocks (boundary): they
\* miss ParamsOK (Signet watchtower_challenge 6 < wtp + r + 2 = 7; Regtest
\* watchtower_challenge 1 < 3, connector_f 4 < 6, connector_d 3 < 6) with
\* r = action_window, sl = 1. EveryCase: ReproducesOnEveryCase FAILS iff the
\* fix fails on both networks - the fix needs those timelocks raised.
CONSTANTS
    Watchtowers = {w1, w2}
    Faulty = {w1, w2}
    ProofValidity = {FALSE, TRUE}
    FixCommitTimeout = TRUE
    FixNackAll = TRUE
    FixUngateAssert = TRUE
    FixNoCancel = TRUE
    UseShipped = TRUE
    NetSet = {"Signet", "Regtest"}
    ShippedDelay = {"action_window"}
    RepairTimelocks = FALSE
    WCRange = {0}
    ACKRange = {0}
    COMMITRange = {0}
    CFRange = {0}
    CDRange = {0}
    PCRange = {0}
    WtProofRange = {0}
    RRange = {0}
    ScanLagRange = {0}
    Region = "all"
    UseValidator = FALSE
    ReactionRange = {0}
    InclusionRange = {0}
    SafetyRange = {0}
    EvidenceRange = {0}
    SlackRange = {0}
    EveryCase = TRUE
    BugProp = "any"
    CoarseTime = TRUE
    AssertAtWCIOnly = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
SYMMETRY WatchtowerSymmetry
INVARIANT TypeOk
INVARIANT ReproducesOnEveryCase
