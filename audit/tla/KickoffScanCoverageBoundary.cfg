\* Tier boundary: ParamsOK (NumGraphs <= ScanBatch * Take1Ticks) is necessary.
\* ceil(7 / 3) = 3 ticks for one lap of the round-robin, but only 2 ticks
\* before Take1 is spendable. Expected to FAIL: a kicked graph the cursor
\* has just passed is not scanned again in time.
CONSTANTS NumGraphs = 7  ScanBatch = 3  Take1Ticks = 2
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOk
INVARIANT KickoffAlwaysCovered
