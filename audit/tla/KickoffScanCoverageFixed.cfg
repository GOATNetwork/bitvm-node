\* Current code (tier pass): scan_graphs_on_chain scans every monitored graph
\* in a round-robin of SCAN_BATCH per tick - no root, no depth cap. Scaled
\* down (shipped SCAN_BATCH = 64) so one lap needs several ticks:
\* ceil(7 / 3) = 3 = Take1Ticks, i.e. ParamsOK holds. Expected to PASS: the
\* kicked graph is scanned before Take1 is spendable, wherever it sits.
CONSTANTS NumGraphs = 7  ScanBatch = 3  Take1Ticks = 3
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOk
INVARIANT KickoffAlwaysCovered
