\* DEPTH-LIMIT RESIDUAL of #451 (root-only entry): a chain of idle decoys
\* deeper than the walk cap. ScanDepth=2 with 4 graphs (real analogue: >32
\* decoys, kick beyond depth 32). Expected to FAIL: kicking the graph beyond
\* the depth budget escapes the single walk from the root. Fixed by removing
\* the cap (see KickoffScanCoverageFixed.cfg); frozen as the regression
\* record of the capped walk.
CONSTANTS NumGraphs = 4  ScanDepth = 2
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT KickoffAlwaysCovered
