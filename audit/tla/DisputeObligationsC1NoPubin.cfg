\* C1, refinement (b) (current code, live): w2 offline or colluding; C2, the
\* ChallengeAssert gate and NACK-every-Ack fixed - only the all_resolved gate
\* on OperatorCommitPubinTimeout (graph_scan.rs:679-687) is left. With a
\* VALID proof the operator spends Ack_w2 through its hashlock leaf (no
\* challenge needed, so no NACK), never commits pubin, and the verifier
\* correctly waits for commit-pubin before skipping a valid proof: Take-2
\* lands with a proof never bound to the watchtowers' evidence.
\* Shipped timelocks of all four networks (ShippedTimelockValues), r = the
\* network's action_window, sl = 1 (is_timelock_ready as shipped). EveryCase runs
\* the networks one after another: ReproducesOnEveryCase FAILS iff the bug
\* reproduces on EVERY network. CoarseTime only restricts when the adversary
\* acts (a counterexample is still genuine).
CONSTANTS
    Watchtowers = {w1, w2}
    Faulty = {w2}
    ProofValidity = {TRUE}
    FixCommitTimeout = FALSE
    FixNackAll = TRUE
    FixUngateAssert = TRUE
    FixNoCancel = TRUE
    UseShipped = TRUE
    NetSet = {"Bitcoin", "Testnet4", "Signet", "Regtest"}
    ShippedDelay = {"action_window"}
    RepairTimelocks = FALSE
    WCRange = {0}
    ACKRange = {0}
    COMMITRange = {0}
    CFRange = {0}
    CDRange = {0}
    PCRange = {0}
    WtProofRange = {0}
    RRange = {0}
    ScanLagRange = {0}
    Region = "all"
    UseValidator = FALSE
    ReactionRange = {0}
    InclusionRange = {0}
    SafetyRange = {0}
    EvidenceRange = {0}
    SlackRange = {0}
    EveryCase = TRUE
    BugProp = "nopubin"
    CoarseTime = TRUE
    AssertAtWCIOnly = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOk
INVARIANT ReproducesOnEveryCase
