    FixNackAll = TRUE
    FixUngateAssert = TRUE
    FixNoCancel = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTake2WithInvalidProof
INVARIANT NoTake2WithoutPubin
