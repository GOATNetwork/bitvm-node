\* C1, refinement (b) (current code, live): w2 offline or colluding; C2, the
\* ChallengeAssert gate and NACK-every-Ack fixed - only the all_resolved gate
\* on OperatorCommitPubinTimeout (graph_scan.rs:679-687) is left. With a
\* VALID proof the operator spends Ack_w2 through its hashlock leaf (no
\* challenge needed, so no NACK), never commits pubin, and the verifier
\* correctly waits for commit-pubin before skipping a valid proof: Take-2
\* lands with a proof never bound to the watchtowers' evidence. Expected to
\* FAIL NoTake2WithoutPubin (NoTake2WithInvalidProof holds).
\* Timelocks: testnet4 (crates/bitvm-gc/src/timelocks.rs NODE_TESTNET_TIMELOCK_CONFIG);
\* WtProof = watchtower_proof_blocks, R = action_window of TESTNET_TIMING_BUDGET;
\* ScanLag = 1 is graph_scan.rs:474 is_timelock_ready as shipped.
