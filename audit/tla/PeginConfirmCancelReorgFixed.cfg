\* H6 FIX DESIGN: the SPV only records headers SpvLag >= MaxReorg deep (and
\* the post waits SpvLag+1 confirmations), so no recorded header is ever
\* reorged out; a Byzantine poster has no stale header to use. The current
\* one-block gate overlap is kept on purpose: it is not needed for safety ->
\* expected to PASS.
SPECIFICATION Spec
CONSTANTS
    T0 = 2
    Hp = 1
    Overlap = 1
    SpvLag = 2
    PostConf = 3
    MaxReorg = 2
    ByzPoster = TRUE
    MaxHeight = 8
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoUnbackedMint
PROPERTIES
    RelayerL1NeverRegresses
