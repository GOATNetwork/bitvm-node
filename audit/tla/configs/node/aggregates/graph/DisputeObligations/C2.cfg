\* C2 (current code, live): every watchtower honest and online, NO fix. The
\* operator confirms its Assert before the watchtowers' proofs are ready
\* (as early as WCI's own block); graph_pegout.rs:606-622 cancels every
\* JOB_WATCHTOWER_CHALLENGE, no branch is ever challenged, all_resolved stays
\* false (C1) and an invalid proof reaches Take-2.
\* Shipped timelocks of all four networks (ShippedTimelockValues), r = the
\* network's action_window, sl = 1 (is_timelock_ready as shipped). EveryCase runs
\* the networks one after another: ReproducesOnEveryCase FAILS iff the bug
\* reproduces on EVERY network. CoarseTime only restricts when the adversary
\* acts (a counterexample is still genuine).
CONSTANTS
    Watchtowers = {w1, w2}
    Faulty = {}
    ProofValidity = {FALSE}
    FixCommitTimeout = FALSE
    FixNackAll = FALSE
    FixUngateAssert = FALSE
    FixNoCancel = FALSE
    UseShipped = TRUE
    NetSet = {"Bitcoin", "Testnet4", "Signet", "Regtest"}
    ShippedDelay = {"action_window"}
    RepairTimelocks = FALSE
    WCRange = {0}
    ACKRange = {0}
    COMMITRange = {0}
    CFRange = {0}
    CDRange = {0}
    PCRange = {0}
    WtProofRange = {0}
    RRange = {0}
    ScanLagRange = {0}
    Region = "all"
    UseValidator = FALSE
    ReactionRange = {0}
    InclusionRange = {0}
    SafetyRange = {0}
    EvidenceRange = {0}
    SlackRange = {0}
    EveryCase = TRUE
    BugProp = "invalid"
    CoarseTime = TRUE
    AssertAtWCIOnly = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOk
INVARIANT ReproducesOnEveryCase
