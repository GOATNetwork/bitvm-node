\* C1, refinement (a) (current code, live): every watchtower honest and
\* online, C2 fixed, and Commit-Timeout / NACK already fixed - only the
\* connector-E gate in verifier_assert (graph_pegout_jobs.rs:767-779) is
\* left. Every branch resolves; the operator commits pubin just before
\* Commit-Timeout lands, so the ChallengeAssert can start only then, and
\* commit + 2 sl + 3 r + pc + 1 >= cf makes the Disprove lose to Take-2.
\* RepairTimelocks raises Signet/Regtest to ParamsOK (Bitcoin/Testnet4 are
\* unchanged), so the gate alone is shown to be enough.
\* Shipped timelocks of all four networks (ShippedTimelockValues), r = the
\* network's action_window, sl = 1 (is_timelock_ready as shipped). EveryCase runs
\* the networks one after another: ReproducesOnEveryCase FAILS iff the bug
\* reproduces on EVERY network. CoarseTime only restricts when the adversary
\* acts (a counterexample is still genuine).
CONSTANTS
    Watchtowers = {w1, w2}
    Faulty = {}
    ProofValidity = {FALSE}
    FixCommitTimeout = TRUE
    FixNackAll = TRUE
    FixUngateAssert = FALSE
    FixNoCancel = TRUE
    UseShipped = TRUE
    NetSet = {"Bitcoin", "Testnet4", "Signet", "Regtest"}
    ShippedDelay = {"action_window"}
    RepairTimelocks = TRUE
    WCRange = {0}
    ACKRange = {0}
    COMMITRange = {0}
    CFRange = {0}
    CDRange = {0}
    PCRange = {0}
    WtProofRange = {0}
    RRange = {0}
    ScanLagRange = {0}
    Region = "all"
    UseValidator = FALSE
    ReactionRange = {0}
    InclusionRange = {0}
    SafetyRange = {0}
    EvidenceRange = {0}
    SlackRange = {0}
    EveryCase = TRUE
    BugProp = "invalid"
    CoarseTime = TRUE
    AssertAtWCIOnly = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOk
INVARIANT ReproducesOnEveryCase
