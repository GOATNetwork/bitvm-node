\* C2 in isolation (current code, live): every watchtower honest and online,
\* the three C1 fixes applied, AssertSent still cancels
\* JOB_WATCHTOWER_CHALLENGE (graph_pegout.rs:606-622). Take-2 is now stopped,
\* but an early Assert still silences every honest watchtower: its evidence
\* never reaches the chain. RepairTimelocks raises Signet/Regtest to ParamsOK
\* (on the shipped Signet/Regtest values the watchtower window alone already
\* fails, see FixedShippedBoundary), so the cancel alone is shown to be enough.
\* Shipped timelocks of all four networks (ShippedTimelockValues), r = the
\* network's action_window, sl = 1 (is_timelock_ready as shipped). EveryCase runs
\* the networks one after another: ReproducesOnEveryCase FAILS iff the bug
\* reproduces on EVERY network. CoarseTime only restricts when the adversary
\* acts (a counterexample is still genuine).
