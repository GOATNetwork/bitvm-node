\* tier boundary
\* COST OF THE FIX: the fixed gate contests an Initialized withdraw that is
\* not Processing by its wake (kickH + ca - 1 - incl - r). The relayer can
\* only proceedWithdraw once spv >= kickH (tip >= kickH + sc, + lag, + its
\* own reaction), so an HONEST withdraw (initialized before the kickoff) is
\* left unchallenged only under ParamsLive == ca >= sc + lag + 2r + incl + 3.
\* BOUNDARY: sweep restricted to ParamsOK /\ ~ParamsLive. Expected to FAIL
\* (per point it fails at EVERY such point, so ParamsLive is exact).
CONSTANTS
    NetSet = {}  ShippedBudget = "range"  LazySpv = FALSE
    ConnectorARange = {2,3,4,5,6,7}  SpvConfirmsRange = {1,2}  InclusionRange = {1,2}  ReactionRange = {0,1,2}
    SpvLagRange = {0,1}  SyncStallRange = {0}
    Region = "notlive"
    EnableLateInit = TRUE  FixGate = TRUE  FixScan = TRUE  FixCancel = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOk
INVARIANT NoHonestChallenge
