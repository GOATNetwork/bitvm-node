\* M2, CURRENT CODE (live): honest broadcaster only. Sweep T0 {1,2,8}, B1/B2
\* 1..3, incl 1..6 (see header). Once the pending Confirm can outlast a
\* node's buffer (incl >= B+2: fixed fee, no fee bump), that node, not seeing
\* it in its mempool at H_p+T0+B, enters Timeout; the Confirm then confirms;
\* the other node goes RelayerL1Broadcasted while the Timeout node only
\* alerts -> expected to FAIL Agreement.
SPECIFICATION Spec
CONSTANTS
    NetSet = {}
    T0Range = {1,2,8}
    B1Range = {1,2,3}
    B2Range = {1,2,3}
    InclRange = {1,2,3,4,5,6}
    ShippedIncl = "budget"
    ParamFilter = "all"
    Fix = "none"
    ByzBroadcast = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOk
    MintOnlyAfterConfirm
PROPERTIES
    Agreement
