\* Current code with deletion on (never on Timeout), shipped values as in
\* Shipped.cfg, all four networks.
\* Expected: counterexample (NoSweepAfterSettlement) on every network.
SPECIFICATION Spec
CONSTANTS
    NetSet = {"Bitcoin","Testnet4","Signet","Regtest"}
    T0Range = {1}
    BRange = {1}
    KDRange = {0}
    ReactRange = {0}
    TimeoutDelayRange = {0}
    WindowRange = {0}
    ParamFilter = "all"
    DeleteEnabled = TRUE
    DeleteOnTimeout = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOk
    NoEarlySuccessDelete
    NoSweepAfterSettlement
