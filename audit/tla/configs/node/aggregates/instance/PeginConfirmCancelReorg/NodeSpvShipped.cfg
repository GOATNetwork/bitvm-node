\* H6, node SPV writer at the SHIPPED lag k = BtcBlockConfirms (boundary):
\* reorgs up to k+1 deep (7/11/7/2) - one block past ParamsOK (spvLag >=
\* maxReorg) on every network -> expected to FAIL NoUnbackedMint (honest
\* relayer alone suffices). Reorgs up to k deep are safe (FixedShipped).
SPECIFICATION Spec
CONSTANTS
    NetSet = {"Bitcoin","Testnet4","Signet","Regtest"}
    T0Range = {1}
    SpvLagRange = {0}
    PostConfRange = {1}
    MaxReorgRange = {1}
    SpvFeeder = "node"
    ReorgBound = "spv+1"
    ParamFilter = "all"
    GateOverlap = 1
    ByzPoster = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOk
    NoUnbackedMint
PROPERTIES
    RelayerL1NeverRegresses
