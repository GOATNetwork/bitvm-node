\* Fix design: presign the defender txs as v3/TRUC (parent <= 10 kvB, one
\* child <= 1 kvB, sibling eviction / 1p1c package RBF). The pin's absolute
\* fee is capped at 1 kvB x sub-market feerate, so the defender's CPFP
\* always evicts it within budget. Swept over every ParamsOK tuple
\* (reaction + inclusion + 1 <= deadline). Swept: deadline 1..6, reaction
\* 1..2, inclusion 0..2, market feerate 1..3 (x presigned), headroom {0, 5}
\* (header: why exhaustive). Expected to PASS.
SPECIFICATION Spec
CONSTANTS
    TRUC = TRUE
    PSize = 1
    PFee = 1
    Incr = 1
    DefChildSize = 1
    V2DescendantMax = 101
    TrucChildMax = 1
    TrucParentMax = 10
    UseShipped = FALSE
    NetSet = {}
    DeadlineRange = {1, 2, 3, 4, 5, 6}
    ReactionRange = {1, 2}
    InclusionRange = {0, 1, 2}
    MarketRange = {1, 2, 3}
    HeadroomRange = {0, 5}
    ParamSel = "ok"
CHECK_DEADLOCK TRUE
INVARIANT TypeOk
INVARIANT DefenderConfirmsBeforeDeadline
