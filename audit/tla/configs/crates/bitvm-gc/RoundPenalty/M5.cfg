\* M5 on CURRENT scripts: ForceSkipConnector is operator-key-only, so the
\* operator burns ForceSkipConn_1 in the block that creates it (killing
\* ForceSkipKickoff_0 and QuickChallenge_0), advances to round 2 in the
\* same block (killing ChallengeIncompleteKickoff_0, which watchers are
\* generously allowed to use here), then kicks off slot 0 late and takes.
\* Swept over ParamsOK only (watchers have all the time they need): the bug
\* is not a timing one. Swept: take CSV (connector_a) 1..6, reaction 1..2,
\* inclusion 0..2 (header: why exhaustive). Expected to FAIL
\* LateKickoffPenalized.
SPECIFICATION Spec
CONSTANTS
    ForceSkipNofN = FALSE
    UseShipped = FALSE
    NetSet = {}
    TakeCSVRange = {1, 2, 3, 4, 5, 6}
    ReactionRange = {1, 2}
    InclusionRange = {0, 1, 2}
    ParamSel = "ok"
CHECK_DEADLOCK TRUE
INVARIANT TypeOk
INVARIANT LateKickoffPenalized
