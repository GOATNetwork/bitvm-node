\* Fix design: ForceSkipConnector is an n-of-n (committee) spend, co-
\* presigned on ForceSkipKickoff_i / QuickChallenge_i. The operator can no
\* longer burn it, so QuickChallenge_0 stays valid for any late Kickoff_0.
\* Swept over every ParamsOK tuple (reaction + inclusion + 1 <=
\* connector_a). Swept: take CSV (connector_a) 1..6, reaction 1..2,
\* inclusion 0..2 (header: why exhaustive). Expected to PASS.
SPECIFICATION Spec
CONSTANTS
    ForceSkipNofN = TRUE
    UseShipped = FALSE
    NetSet = {}
    TakeCSVRange = {1, 2, 3, 4, 5, 6}
    ReactionRange = {1, 2}
    InclusionRange = {0, 1, 2}
    ParamSel = "ok"
CHECK_DEADLOCK TRUE
INVARIANT TypeOk
INVARIANT LateKickoffPenalized
