\* Current code, shipped timing, all four networks: 1 slot, one graph, N = 1..5, 5/15-min evaluations.
\* Fails iff N*E > T2 - React - Incl: Testnet4, Signet, Regtest (not Bitcoin in this range).
\* Expected: counterexample (HonestOperatorAnswersAll).
SPECIFICATION Spec
