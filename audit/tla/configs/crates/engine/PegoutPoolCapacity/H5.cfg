    PerAggregateSerial = TRUE
    VarDur = FALSE
    UseShipped = TRUE
    Region = "All"
    GRange = {1}
    NRange = {1,2,3,4,5}
    SlotsRange = {1}
    ERange = {1}
    T2Range = {1}
    InclRange = {0}
    ReactRange = {0}
    NetSet = {"Bitcoin", "Testnet4", "Signet", "Regtest"}
    EvalSecsRange = {300, 900}
CHECK_DEADLOCK FALSE
INVARIANT TypeOk
INVARIANT HonestOperatorAnswersAll
PROPERTY ParamsFrozen
