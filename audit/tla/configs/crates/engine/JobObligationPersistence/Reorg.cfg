\* Tier: live (current code).
\* H3(d), CURRENT code, SHIPPED timing: Take1/Take2/Disprove/Skipped are
\* decided at one confirmation (btc.rs:451-468, graph_chain_state.rs:302-316),
\* are absorbing (schema.rs:438-507) and closed graphs are never rescanned
\* (graph_scan.rs:113-127). Reorg depths 1 .. BtcBlockConfirms[net]-1 - the
\* depths the node itself treats as not yet final (SPV updater lag) - with
\* the defence window long enough to answer the reorged-in obligation
\* (TimingOK). A reorg that mines the conflicting spend (e.g. a Challenge
\* instead of Take-1) leaves the node treating the graph as closed -
\* expected to FAIL NoFalseClosure (Bitcoin, Testnet4, Signet; on Regtest
\* BtcBlockConfirms = 1 assumes no reorg, so no point is swept there).
SPECIFICATION Spec
CONSTANTS
    FixRearm = FALSE
    FaultKinds = {}
    ReorgFaults = 1
    UseShipped = TRUE
    Region = "TimingOK"
    WindowRange = {1}
    ReactRange = {0}
    InclRange = {0}
    CloseDepthRange = {1}
    RetryRange = {1}
    FaultRange = {0}
    MaxReorgRange = {1,2,3,4,5,6,7,8,9}
    NetSet = {"Bitcoin", "Testnet4", "Signet", "Regtest"}
    Obligations = {"challenge_kickoff", "wrongly_challenged", "disprove"}
    CloseDepthRule = "Code"
CHECK_DEADLOCK FALSE
INVARIANT TypeOk
INVARIANT NoFalseClosure
INVARIANT DefenceEventuallyRuns
PROPERTY ParamsFrozen
