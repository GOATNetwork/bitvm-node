\* C3 and C4 are timing-independent. CURRENT scripts, Script = TRUE: every
\* honest action at its deadline, the attacker as early as possible, for
\* EVERY swept tuple (no ParamsOK filter) and both proof validities.
\* AttackWinsForAllParams: valid proof -> C4 redirect, the honest operator
