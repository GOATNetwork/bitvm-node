\* under ParamsOK, only because its ChallengeAssert was front-run (C3).
\* CHECK_DEADLOCK: every tuple reaches the end of its horizon. Parameters
\* swept (header: why exhaustive): prover_connector 1..6, connector_d
\* 1..15, reaction 1..2, inclusion 0..1, GC eval (verifier, operator) 0..1
\* each. Expected to PASS (a lemma about the bug, not a fix).
