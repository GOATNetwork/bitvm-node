\* set; the honest answers make quorum -> expected to PASS. Spam 0, small
\* sweep tpb 1..2, T0 2/4, gd, cd 0..1 restricted to ParamsOK (the F1 timing
\* margin; outside it the peg-in fails for F1 reasons, not F6).
