\* Fix design for C1 + C2: OperatorCommitPubinTimeout at operator_commit
\* whatever the watchtower branches; NackReady for every unspent Ack
\* connector after operator_ack; an invalid proof is challenged without
\* waiting for commit-pubin; AssertSent no longer cancels
\* JOB_WATCHTOWER_CHALLENGE. Any subset of the watchtowers may be offline or
\* colluding (Faulty = all), the proof may be valid or not, and the one-block
\* lag of is_timelock_ready is kept (ScanLag = 1). MaxH = 82 lets the Assert
\* come as late as block 50, after every WCI-rooted deadline (Commit-Timeout
\* by 49); a later Assert only shifts the Disprove race. Expected to PASS.
\* Timelocks: testnet4 (crates/bitvm-gc/src/timelocks.rs NODE_TESTNET_TIMELOCK_CONFIG);
\* WtProof = watchtower_proof_blocks, R = action_window of TESTNET_TIMING_BUDGET;
\* ScanLag = 1 is graph_scan.rs:474 is_timelock_ready as shipped.
CONSTANTS
    Watchtowers = {w1, w2}
    Faulty = {w1, w2}
    WC = 20
    ACK = 28
    COMMIT = 42
    CF = 56
    CD = 32
    PC = 16
    WtProof = 12
    R = 6
    ScanLag = 1
    MaxH = 82
    ProofValidity = {FALSE, TRUE}
    FixCommitTimeout = TRUE
    FixNackAll = TRUE
    FixUngateAssert = TRUE
    FixNoCancel = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
SYMMETRY WatchtowerSymmetry
INVARIANT TypeOK
INVARIANT NoTake2WithInvalidProof
INVARIANT NoTake2WithoutPubin
INVARIANT OnlineWatchtowerChallengeLands
