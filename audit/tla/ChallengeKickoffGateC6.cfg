\* C6, CURRENT CODE (dev 60562f8): challenge_kickoff waits until GOAT SPV
\* covers the kickoff block (kickoff_height >= spv_height -> after_blocks)
\* with no deadline tied to connector_a. GOAT SPV lag is bounded (MaxSpvLag)
\* but may reach the connector_a window. Initialization only before the
\* kickoff (C5 closed) and no sync stall (H4 closed). The #429 Fixed model
\* assumed SPV always catches up first. Expected to FAIL NoUnauthorizedTake1.
CONSTANTS
    ConnectorA = 5  SpvConfirms = 1  MaxSpvLag = 4  Inclusion = 1
    MaxSyncStall = 0  EnableLateInit = FALSE
    FixGate = FALSE  FixScan = FALSE  FixCancel = FALSE
    MaxH = 9
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoUnauthorizedTake1
