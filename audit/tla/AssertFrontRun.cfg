\* C3 on CURRENT scripts (goat bab46c2): VerifierConnector leaf 0 has no
\* CHECKSIG, so the cheating operator (invalid proof) copies the honest
\* verifier's ChallengeAssert witness into its own higher-fee tx; the
\* presigned Disprove_j is then permanently invalid and Take2 follows -
\* expected to FAIL NoTake2AfterValidChallenge.
SPECIFICATION Spec
CONSTANTS
    ProofValidity = {FALSE}
    VerifierLeafChecksig = FALSE
    ConnCLeafChecksig = FALSE
    PiCommitted = FALSE
    DisproveCSV = 1
    Take2CSV = 3
    MaxT = 6
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTake2AfterValidChallenge
