\* Full fix design (every script fix on) with the SHIPPED Regtest values:
\* prover_connector 1, connector_d 3, ReactionBlocks 1, InclusionBlocks 0.
\* CondWC needs prover_connector >= 2 (Wrongly-Challenged lands at the
\* earliest one block after the ChallengeAssert, the same block a malicious
\* Disprove may take), CondDisprove needs connector_d >= 5 (the node fires
\* Disprove at tip >= vaAt + prover_connector, one block after the mempool
\* would take it, so it ties Take2). A pure timing bug of the shipped
\* Regtest config, independent of C3/C4. Expected to FAIL.
SPECIFICATION Spec
CONSTANTS
    ProofValidity = {TRUE, FALSE}
    VerifierLeafChecksig = TRUE
    ConnCLeafChecksig = TRUE
    PiCommitted = TRUE
    UseShipped = TRUE
    NetSet = {"Regtest"}
    DisproveCSVRange = {0}
    Take2CSVRange = {0}
    ReactionRange = {0}
    InclusionRange = {0}
    SafetyRange = {0}
    EvalVRange = {0}
    EvalORange = {0}
    ParamSel = "all"
    Script = FALSE
CHECK_DEADLOCK TRUE
INVARIANT TypeOk
INVARIANT HonestOperatorCanSettle
INVARIANT NoTake2WithInvalidProof
