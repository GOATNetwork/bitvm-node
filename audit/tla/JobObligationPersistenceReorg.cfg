\* H3(d), CURRENT code: Take1/Take2/Disprove/Skipped are decided at one
\* confirmation (btc.rs:451-468, graph_chain_state.rs:304-316), are
\* absorbing (schema.rs:438-507) and closed graphs are never rescanned
\* (graph_scan.rs:113-127). A 1-block reorg that mines the conflicting
\* spend (e.g. a Challenge instead of Take-1) leaves the node treating the
\* graph as closed - expected to FAIL NoFalseClosure.
SPECIFICATION Spec
CONSTANTS
    Deadline = 5
    PanicFaults = 0
    RevertFaults = 0
    GiveUpFaults = 0
    ReorgFaults = 1
    MaxReorg = 1
    CloseDepth = 1
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoFalseClosure
INVARIANT DefenceEventuallyRuns
