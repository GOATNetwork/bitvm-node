\* C4 on CURRENT scripts (goat bab46c2): ConnectorC leaf 1 is OP_2DROP +
\* WOTS checksig only, so any watcher copies an honest operator's
\* OperatorAssert witness into a tx with other outputs; ConnectorD never
\* exists (no Take2) and C is spent (no Take1) - expected to FAIL
\* HonestOperatorCanSettle.
SPECIFICATION Spec
CONSTANTS
    ProofValidity = {TRUE}
    VerifierLeafChecksig = FALSE
    ConnCLeafChecksig = FALSE
    PiCommitted = FALSE
    DisproveCSV = 1
    Take2CSV = 3
    MaxT = 6
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT HonestOperatorCanSettle
