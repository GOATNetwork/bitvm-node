    ProofValidity = {FALSE}
    VerifierLeafChecksig = TRUE
    ConnCLeafChecksig = FALSE
    PiCommitted = FALSE
    DisproveCSV = 1
    Take2CSV = 3
    MaxT = 6
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTake2AfterValidChallenge
INVARIANT HonestVerifierCanDisprove
