\* M3 on CURRENT scripts with the SHIPPED values of all four networks:
\* deadline = connector_f - operator_ack (NACK), connector_f -
\* operator_commit (Commit-Timeout), connector_d - prover_connector -
\* (reaction + inclusion) (Disprove); ReactionBlocks / InclusionBlocks;
\* market 1..3, headroom {0, 5}. Expected to FAIL
\* DefenderConfirmsBeforeDeadline.
SPECIFICATION Spec
CONSTANTS
    TRUC = FALSE
    PSize = 1
    PFee = 1
    Incr = 1
    DefChildSize = 1
    V2DescendantMax = 101
    TrucChildMax = 1
    TrucParentMax = 10
    UseShipped = TRUE
    NetSet = {"Bitcoin", "Testnet4", "Signet", "Regtest"}
    DeadlineRange = {0}
    ReactionRange = {0}
    InclusionRange = {0}
    MarketRange = {1, 2, 3}
    HeadroomRange = {0, 5}
    ParamSel = "all"
CHECK_DEADLOCK TRUE
INVARIANT TypeOk
INVARIANT DefenderConfirmsBeforeDeadline
