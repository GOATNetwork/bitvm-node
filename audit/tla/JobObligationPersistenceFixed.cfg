\* H3 fix design: obligations re-derived each scan, a job row that ended
\* without broadcasting is re-armed under a new generation while the
\* precondition holds, and a closing stage is decided only at
\* CloseDepth > MaxReorg confirmations. Every fault at once (one panic, one
\* Permanent-classified revert, one give-up, one 1-block reorg) - expected
\* to PASS both properties.
SPECIFICATION SpecFixed
CONSTANTS
    Deadline = 5
    PanicFaults = 1
    RevertFaults = 1
    GiveUpFaults = 1
    ReorgFaults = 1
    MaxReorg = 1
    CloseDepth = 2
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoFalseClosure
INVARIANT DefenceEventuallyRuns
