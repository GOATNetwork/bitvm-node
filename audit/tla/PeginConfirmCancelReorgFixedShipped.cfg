\* H6 with SHIPPED values (design): node SPV writer lag k = BtcBlockConfirms,
\* reorgs up to max(1, EvidenceConfirmations) deep, colluding poster on.
\* ParamsOK (k >= reorg bound) holds on every network (6>=6, 10>=10, 6>=1,
\* 1>=1; margin 0 on Bitcoin and Testnet4), so no timelock change is
\* needed - provided the node writer is the only SPV feeder and
\* BTC_BLOCK_CONFIRMS is not lowered. Unfiltered -> expected to PASS.
SPECIFICATION Spec
CONSTANTS
    NetSet = {"Bitcoin","Testnet4","Signet","Regtest"}
    T0Range = {1}
    SpvLagRange = {0}
    PostConfRange = {1}
    MaxReorgRange = {1}
    SpvFeeder = "node"
    ReorgBound = "evidence"
    ParamFilter = "all"
    GateOverlap = 1
    ByzPoster = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOk
    NoUnbackedMint
PROPERTIES
    RelayerL1NeverRegresses
