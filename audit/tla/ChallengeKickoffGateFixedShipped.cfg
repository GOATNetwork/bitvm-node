\* tier design
\* FIX DESIGN (all three findings): challenge_kickoff challenges a poisoned
\* Initialized withdraw (btcBlockHeightAtWithdraw >= kickoff height) and,
\* once the tip reaches kickH + ca - 1 - incl - r, contests regardless of SPV
\* unless the withdraw is Processing; its retries never sleep past that wake;
\* the chain scan that queues it is not gated on the Goat history sync; and
\* the contract rejects committeeCancelWithdraw once the kickoff is provable.
\* Late init on. SyncStallRange {0}: with FixScan the sync flag appears in no
\* guard except the stall bound, so a stall only removes behaviours.
\* SHIPPED values of Bitcoin, Testnet4 and Signet (ShippedTimelockValues).
\* ShippedBudget "worst": the fix computes its wake from the shipped budget
\* (r = ReactionBlocks, incl = max(1, InclusionBlocks)), which is how it would
\* be deployed; r is an upper bound (faster reactions are included) and a
\* faster real inclusion only helps the Challenge. Extra SPV lag up to 2
\* (an upper bound, so lag 0 and 1 are included; the fix never waits on the
\* SPV). ParamsOK holds on all three (144 >= 13, 6 >= 5, 6 >= 3). Regtest
\* fails ParamsOK (2 < 1+1+1): see FixedRegtest.cfg. Expected to VERIFY.
CONSTANTS
    NetSet = {"Bitcoin", "Testnet4", "Signet"}  ShippedBudget = "worst"  LazySpv = FALSE
    ConnectorARange = {1}  SpvConfirmsRange = {1}  InclusionRange = {1}  ReactionRange = {0}
    SpvLagRange = {2}  SyncStallRange = {0}
    Region = "all"
    EnableLateInit = TRUE  FixGate = TRUE  FixScan = TRUE  FixCancel = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOk
INVARIANT NoUnauthorizedTake1
INVARIANT NoDoublePayment
INVARIANT Take1OnlyAfterBurn
PROPERTY ParamsFrozen
PROPERTY OutcomesFinal
