\* M3 on CURRENT scripts: NACK / CommitTimeout / Disprove are v2 with a
\* keyless P2A anchor; the operator broadcasts the presigned tx bare and pins
\* the anchor with a large sub-market child (up to the 101 kvB descendant
\* limit), so the defender's CPFP must out-pay the pin's absolute fee
\* (BIP125 rule 3) - beyond a budget with 5 kvB-units of headroom - and P
\* is still unconfirmed when Take2 matures - expected to FAIL
\* DefenderConfirmsBeforeDeadline.
SPECIFICATION Spec
CONSTANTS
    TRUC = FALSE
    PSize = 1
    PFee = 1
    Market = 3
    Incr = 1
    DefChildSize = 1
    Headroom = 5
    V2DescendantMax = 101
    TrucChildMax = 1
    TrucParentMax = 10
    Deadline = 3
    MaxT = 4
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT DefenderConfirmsBeforeDeadline
