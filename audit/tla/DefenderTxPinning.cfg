\* M3 on CURRENT scripts: NACK / CommitTimeout / Disprove are v2 with a
\* keyless P2A anchor; the operator broadcasts the presigned tx bare and
\* pins the anchor with a large sub-market child (up to the 101 kvB
\* descendant limit), so the defender's CPFP must out-pay the pin's
\* absolute fee (BIP125 rule 3) and P is still unconfirmed when Take2
\* matures. Swept over ParamsOK only (the defender has all the time it
\* needs): the pin is a fee problem, not a timing one. Swept: deadline
\* 1..6, reaction 1..2, inclusion 0..2, market feerate 1..3 (x presigned),
\* headroom {0, 5} (header: why exhaustive). Expected to FAIL
\* DefenderConfirmsBeforeDeadline.
SPECIFICATION Spec
CONSTANTS
    TRUC = FALSE
    PSize = 1
    PFee = 1
    Incr = 1
    DefChildSize = 1
    V2DescendantMax = 101
    TrucChildMax = 1
    TrucParentMax = 10
    UseShipped = FALSE
    NetSet = {}
    DeadlineRange = {1, 2, 3, 4, 5, 6}
    ReactionRange = {1, 2}
    InclusionRange = {0, 1, 2}
    MarketRange = {1, 2, 3}
    HeadroomRange = {0, 5}
    ParamSel = "ok"
CHECK_DEADLOCK TRUE
INVARIANT TypeOk
INVARIANT DefenderConfirmsBeforeDeadline
