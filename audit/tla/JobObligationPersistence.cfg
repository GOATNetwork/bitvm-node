\* H3(a), CURRENT code: one panic of a defence job (e.g. disprove,
\* wrongly_challenged, challenge_nack) Poisons its stable-id row; every
\* later scan re-requests the same id and INSERT OR IGNORE keeps it
\* Poisoned (worker.rs:344-348 "not run again"), so the defence is never
\* broadcast although the chain still demands it - expected to FAIL
\* DefenceEventuallyRuns.
SPECIFICATION Spec
CONSTANTS
    Deadline = 5
    PanicFaults = 1
    RevertFaults = 0
    GiveUpFaults = 0
    ReorgFaults = 0
    MaxReorg = 0
    CloseDepth = 1
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT DefenceEventuallyRuns
