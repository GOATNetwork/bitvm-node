\* M5 on CURRENT scripts: ForceSkipConnector is operator-key-only, so the
\* operator burns ForceSkipConn_1 as soon as round 1 exists (killing
\* ForceSkipKickoff_0 and QuickChallenge_0), advances to round 2 (killing
\* ChallengeIncompleteKickoff_0, which watchers are generously allowed to
\* use here), then kicks off slot 0 late and takes - expected to FAIL
\* LateKickoffPenalized.
SPECIFICATION Spec
CONSTANTS
    ForceSkipNofN = FALSE
    TakeCSV = 2
    Reaction = 1
    MaxT = 5
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT LateKickoffPenalized
