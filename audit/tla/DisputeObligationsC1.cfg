\* C1 (current code, live): watchtower w2 is offline or colludes with the
\* operator; C2 is taken as fixed (FixNoCancel) so the online watchtower w1
\* does challenge - this isolates C1. The operator ACKs w1, never times w2
\* out and never commits pubin: watchtower_flow keeps all_resolved false (no
\* Commit-Timeout), emits NackReady only for challenged branches (no NACK for
\* w2), and verifier_assert waits for connector-E (no ChallengeAssert), so an
\* invalid proof reaches Take-2. Expected to FAIL NoTake2WithInvalidProof.
\* Timelocks: testnet4 (crates/bitvm-gc/src/timelocks.rs NODE_TESTNET_TIMELOCK_CONFIG);
\* WtProof = watchtower_proof_blocks, R = action_window of TESTNET_TIMING_BUDGET;
\* ScanLag = 1 is graph_scan.rs:474 is_timelock_ready as shipped.
CONSTANTS
    Watchtowers = {w1, w2}
    Faulty = {w2}
    WC = 20
    ACK = 28
    COMMIT = 42
    CF = 56
    CD = 32
    PC = 16
    WtProof = 12
    R = 6
    ScanLag = 1
    MaxH = 58
    ProofValidity = {FALSE}
    FixCommitTimeout = FALSE
    FixNackAll = FALSE
    FixUngateAssert = FALSE
    FixNoCancel = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTake2WithInvalidProof
