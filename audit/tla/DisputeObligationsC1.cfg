\* C1 (current code, live): watchtower w2 is offline or colludes with the
\* operator; C2 is taken as fixed (FixNoCancel) so the online watchtower w1
\* does challenge - this isolates C1. The operator ACKs w1, never times w2
\* out and never commits pubin: watchtower_flow keeps all_resolved false (no
\* Commit-Timeout), emits NackReady only for challenged branches (no NACK for
\* w2), and verifier_assert waits for connector-E (no ChallengeAssert), so an
\* invalid proof reaches Take-2.
\* Shipped timelocks of all four networks (ShippedTimelockValues), r = the
\* network's action_window, sl = 1 (is_timelock_ready as shipped). EveryCase runs
\* the networks one after another: ReproducesOnEveryCase FAILS iff the bug
\* reproduces on EVERY network. CoarseTime only restricts when the adversary
\* acts (a counterexample is still genuine).
CONSTANTS
    Watchtowers = {w1, w2}
    Faulty = {w2}
    ProofValidity = {FALSE}
    FixCommitTimeout = FALSE
    FixNackAll = FALSE
    FixUngateAssert = FALSE
    FixNoCancel = TRUE
    UseShipped = TRUE
    NetSet = {"Bitcoin", "Testnet4", "Signet", "Regtest"}
    ShippedDelay = {"action_window"}
    RepairTimelocks = FALSE
    WCRange = {0}
    ACKRange = {0}
    COMMITRange = {0}
    CFRange = {0}
    CDRange = {0}
    PCRange = {0}
    WtProofRange = {0}
    RRange = {0}
    ScanLagRange = {0}
    Region = "all"
    UseValidator = FALSE
    ReactionRange = {0}
    InclusionRange = {0}
    SafetyRange = {0}
    EvidenceRange = {0}
    SlackRange = {0}
    EveryCase = TRUE
    BugProp = "invalid"
    CoarseTime = TRUE
    AssertAtWCIOnly = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOk
INVARIANT ReproducesOnEveryCase
