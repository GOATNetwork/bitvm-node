# Moved from GOATNetwork/BitVM (branch gc-v2, goat/) at commit 2c76a2c.
# Dependency specs are the ones the BitVM workspace gave this crate.
[package]
name = "goat"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
bitvm = { workspace = true }
bitcoin-script = { git = "https://github.com/BitVM/rust-bitcoin-script" }
bitcoin = { version = "0.32.5", features = ["rand-std"] }
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
bitcoin-scriptexec = { git = "https://github.com/BitVM/rust-bitcoin-scriptexec" }
serde = { version = "1.0.197", features = ["derive"] }
serde-big-array = "0.5.1"
num-traits = "0.2.18"
sha2 = "0.10.8"
blake3 = "1.6.1"
tokio = { version = "1.37.0", features = ["full"] }
serde_json = "1.0.116"
rand = "0.8.5"
regex = "1.10.5"
musig2 = { version = "0.1.0", features = ["serde", "rand"] }
clap = { version = "4.5.23", features = ["derive", "cargo", "env"] }
toml = "0.5.11"
colored = "2.0.0"
itertools = "0.13.0"
serial_test = "*"
ark-bn254 = { version = "0.5.0", features = ["curve", "scalar_field"], default-features = false }
ark-groth16 = "0.5.0"
ark-ff = "0.5.0"
ark-std = { version = "0.5.0", default-features = false, features = ["print-trace"] }
ark-ec = "0.5.0"
ark-crypto-primitives = { version = "0.5.0", features = ["snark", "sponge"] }
ark-serialize = "0.5.0"
ark-relations = "0.5.0"
secp256k1 = { version = "0.29.1", features = ["global-context"] }
zstd = "0.13.2"
bitcode = "0.6.3"
bincode = "1.3.3"
hex = "0.4.3"
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
