# Moved from GOATNetwork/BitVM (branch gc-v2, goat/) at commit 2c76a2c.
# Dependency specs are the ones the BitVM workspace gave this crate.
[package]
name = "goat"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
bitvm = { workspace = true }
# Needed by the paths `bitvm::treepp::script!` expands to.
bitcoin-script = { git = "https://github.com/BitVM/rust-bitcoin-script" }
bitcoin = { version = "0.32.5", features = ["rand-std"] }
strum = { version = "0.27", features = ["derive"] }
serde = { version = "1.0.197", features = ["derive"] }
serde-big-array = "0.5.1"
blake3 = "1.6.1"
rand = "0.8.5"
musig2 = { version = "0.1.0", features = ["serde", "rand"] }
itertools = "0.13.0"
secp256k1 = { version = "0.29.1", features = ["global-context"] }
zstd = "0.13.2"
bitcode = "0.6.3"
hex = "0.4.3"
