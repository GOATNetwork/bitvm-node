specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: GatewayUpgradeable
    network: goat-local
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: GatewayUpgradeable
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - BridgeIn
        - BridgeInRequest
        - CancelWithdraw
        - CommitteeResponse
        - InitWithdraw
        - Initialized
        - PostGraphData
        - ProceedWithdraw
        - WithdrawDisproved
        - WithdrawHappyPath
        - WithdrawUnhappyPath
      abis:
        - name: GatewayUpgradeable
          file: ./abis/GatewayUpgradeable.json
      eventHandlers:
        - event: BridgeIn(indexed address,indexed bytes16,indexed uint64,uint64)
          handler: handleBridgeIn
        - event: BridgeInRequest(indexed bytes16,indexed address,uint64,uint64[3],(bytes32,uint32,uint64)[],bytes32,string,string)
          handler: handleBridgeInRequest
        - event: CancelWithdraw(indexed bytes16,indexed bytes16,indexed address)
          handler: handleCancelWithdraw
        - event: CommitteeResponse(indexed bytes16,indexed address,bytes)
          handler: handleCommitteeResponse
        - event: InitWithdraw(indexed bytes16,indexed bytes16,indexed address,uint64)
          handler: handleInitWithdraw
        - event: Initialized(uint64)
          handler: handleInitialized
        - event: PostGraphData(indexed bytes16,indexed bytes16)
          handler: handlePostGraphData
        - event: ProceedWithdraw(indexed bytes16,indexed bytes16,bytes32)
          handler: handleProceedWithdraw
        - event: WithdrawDisproved(indexed bytes16,indexed bytes16,uint8,uint256,bytes32,bytes32,address,address,uint256,uint256)
          handler: handleWithdrawDisproved
        - event: WithdrawHappyPath(indexed bytes16,indexed bytes16,bytes32,indexed address,uint64)
          handler: handleWithdrawHappyPath
        - event: WithdrawUnhappyPath(indexed bytes16,indexed bytes16,bytes32,indexed address,uint64)
          handler: handleWithdrawUnhappyPath
      file: ./src/gateway-upgradeable.ts
