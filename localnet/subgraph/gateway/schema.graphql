type BridgeIn @entity(immutable: true) {
  id: Bytes!
  depositorAddress: Bytes! # address
  instanceId: Bytes! # bytes16
  peginAmountSats: BigInt! # uint64
  feeAmountSats: BigInt! # uint64
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type BridgeInRequest @entity(immutable: true) {
  id: Bytes!
  instanceId: Bytes! # bytes16
  depositorAddress: Bytes! # address
  peginAmountSats: BigInt! # uint64
  txnFees: [BigInt!]! # uint64[3]
  userInputs: [Bytes!]! # tuple[]
  userXonlyPubkey: Bytes! # bytes32
  userChangeAddress: String! # string
  userRefundAddress: String! # string
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

