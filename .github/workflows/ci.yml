name: Cargo Build & Test

on:
  push:
    branches:
      - main
      - dev
    tags:
      - v[0-9]+.*
  # Run on every pull request regardless of base branch, so the TLA+ formal-
  # verification check (and the rest of CI) runs on ANY PR.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  ZKM_TOOLCHAIN_VERSION: '20260917'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs independently and in parallel with fmt/clippy/test (no `needs:` gating)
  # so EVERY check runs on every PR regardless of the others' outcome. It is a
  # first-class check: it fails (and blocks merge, if branch protection requires
  # it) whenever a `live` bug spec still reproduces its counterexample. See the
  # step below - it runs every spec, prints each one's actual TLC result in the
  # job summary, and routes by tier (pass / historical / live).
  tla-plus:
    name: TLA+ Formal Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download TLA+ tools
        run: make tla-setup
      # Runs every row of audit/tla/specs.txt (tier | config | spec | description)
      # through TLC and judges it by tier - see audit/tla/check.sh:
      #   pass       - a fix/baseline design; must verify.
      #   historical - a bug fixed in the code; the frozen spec must still
      #                reproduce its counterexample (an unexpected pass = drift
      #                or a reverted fix).
      #   live       - a known, unfixed bug; while it reproduces the job fails
      #                and blocks merge. Fix the code, then move the row to
      #                `historical`.
      # A spec on which TLC does not finish fails in every tier. The result
      # table goes to the job summary; `make tla` runs the same locally.
      - name: TLA+ formal verification (verify fixes, reproduce fixed bugs, block live ones)
        run: make tla
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rs/toolchain@v1
        timeout-minutes: 30
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rs/toolchain@v1
        timeout-minutes: 30
        with:
          profile: minimal
          toolchain: nightly-2026-09-17
          override: true
          components: clippy
      - name: Install Ziren toolchain
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/zkmup"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            https://raw.githubusercontent.com/ProjectZKM/toolchain/582f7927cac0668883a86cbd02fbc18b500b1b6f/zkmup \
            -o "$installer"
          sh "$installer" install -v "$ZKM_TOOLCHAIN_VERSION"
          SHELL=/bin/true sh "$installer" setup -v "$ZKM_TOOLCHAIN_VERSION"
          source "$HOME/.zkm-toolchain/env"
          rustc --version
          cargo --version
      - name: Install Dependencies
        run: sudo apt update && sudo apt install protobuf-compiler
      - run: |
          source ~/.zkm-toolchain/env
          cargo clippy --all-targets --features rpc-debug-endpoints -- -D warnings
  test:
    name: Cargo Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Ziren toolchain
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/zkmup"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            https://raw.githubusercontent.com/ProjectZKM/toolchain/582f7927cac0668883a86cbd02fbc18b500b1b6f/zkmup \
            -o "$installer"
          sh "$installer" install -v "$ZKM_TOOLCHAIN_VERSION"
          SHELL=/bin/true sh "$installer" setup -v "$ZKM_TOOLCHAIN_VERSION"
          source "$HOME/.zkm-toolchain/env"
          rustc --version
          cargo --version
      - name: Install Dependencies
        run: sudo apt update && sudo apt install protobuf-compiler
      - name: Launch the Regtest
        run: cd scripts && docker compose up -d
      - name: Run all unit tests
        run: |
          set -e
          source ~/.zkm-toolchain/env
          cargo test -r --all --all-targets --features rpc-debug-endpoints
