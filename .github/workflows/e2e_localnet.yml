name: Localnet e2e

# The whole localnet e2e suite (localnet/README.md, localnet/e2e/README.md) on the self-hosted
# bitvm2-node runner: build the mock-gc binaries, rebuild a private localnet, run all 13 cases.
# ~2 h per run, so it is not a PR gate: same triggers as ci_time_consuming.yml.

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

# One CI localnet per host: queue runs, never cancel one that is half way through.
concurrency:
  group: localnet-e2e
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # A localnet of its own next to any other on the host (ports PORT_BASE+0..999).
  LOCALNET_DATA: /data/actions-runner-bitvm2-node/cache/localnet-e2e/data
  PORT_BASE: "25000"
  COMPOSE_PROJECT: bvci
  # Dedicated target dir, kept between runs; only this workflow builds into it.
  CARGO_TARGET_DIR: /data/actions-runner-bitvm2-node/cache/localnet-e2e/target

jobs:
  e2e:
    name: Localnet e2e
    runs-on: [self-hosted, bitvm2-node]
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build the mock-gc binaries
        run: |
          # results of earlier runs stay in the data dir: keep the last 10, never report a stale one
          mkdir -p "$LOCALNET_DATA/results"
          rm -f "$LOCALNET_DATA/results/latest"
          find "$LOCALNET_DATA/results" -mindepth 1 -maxdepth 1 -type d | sort | head -n -10 | xargs -r rm -rf
          localnet/build.sh

      - name: Reset the localnet
        run: make localnet-reset

      - name: Run the e2e suite
        run: make e2e

      - name: Report
        if: always()
        run: |
          run=$(readlink -f "$LOCALNET_DATA/results/latest" 2>/dev/null || true)
          [ -d "$run" ] || run=""
          echo "E2E_RESULTS=$run" >> "$GITHUB_ENV"
          if [ -f "$run/report.md" ]; then cat "$run/report.md" >> "$GITHUB_STEP_SUMMARY"; else echo "no e2e report" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Stop the localnet
        if: always()
        run: |
          localnet/scripts/chaos.sh reset || true
          localnet/scripts/down.sh infra

      - name: Upload the results
        if: always() && env.E2E_RESULTS != ''
        uses: actions/upload-artifact@v4
        with:
          name: localnet-e2e-${{ github.run_id }}
          path: ${{ env.E2E_RESULTS }}
          retention-days: 14
