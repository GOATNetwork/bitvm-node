name: Install Ziren toolchain
description: The pinned Ziren toolchain every workflow builds with.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        # Bump both together, in this file only.
        ZKMUP_COMMIT: 582f7927cac0668883a86cbd02fbc18b500b1b6f
        ZKM_TOOLCHAIN_VERSION: '20260917'
      run: |
        set -euo pipefail
        installer="$RUNNER_TEMP/zkmup"
        curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
          "https://raw.githubusercontent.com/ProjectZKM/toolchain/${ZKMUP_COMMIT}/zkmup" \
          -o "$installer"
        sh "$installer" install -v "$ZKM_TOOLCHAIN_VERSION"
        SHELL=/bin/true sh "$installer" setup -v "$ZKM_TOOLCHAIN_VERSION"
        source "$HOME/.zkm-toolchain/env"
        rustc --version
        cargo --version
